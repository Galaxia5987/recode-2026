name: Post Graph Updates

on:
  pull_request:
    paths:
      - 'graphs/**/*.md'

jobs:
  post-graphs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Comment Body
        id: build-comment
        run: |
          # Generate a random delimiter for the multiline GitHub Actions output
          delimiter="$(openssl rand -hex 8)"
          echo "comment_body<<$delimiter" >> $GITHUB_OUTPUT
          
          echo "## Updated State Machine Graphs" >> $GITHUB_OUTPUT
          echo "Generated from the latest commit." >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          
          # Iterate through all markdown files in the graphs directory and append them
          find graphs -name "*.md" -type f | sort | while read -r file; do
            echo "### \`$file\`" >> $GITHUB_OUTPUT
            cat "$file" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          done
          
          echo "$delimiter" >> $GITHUB_OUTPUT

      - name: Create or Update PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: state-machine-graphs
          message: ${{ steps.build-comment.outputs.comment_body }}